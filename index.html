<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142638"><title>Lift Log | Upper Lower</title>
<style>
:root{--ink:#142638;--ink2:#203b52;--blue:#477fa8;--bg:#f3f6f8;--card:#fff;--muted:#718096;--line:#e2e8ee;--green:#18794e;--greenbg:#e7f5ed;--amber:#9a6700;--amberbg:#fff4d6;--red:#b42318;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:var(--ink);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;letter-spacing:.13em;font-weight:800;color:#b8cbd9}.top h1{font-size:25px;margin:5px 0 0}.top p{margin:3px 0 0;color:#c0cfda;font-size:13px}.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid #496175;background:#203b52;color:white;border-radius:12px;padding:9px 11px}.content{padding:17px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;max-width:190px;border:0;background:none;color:var(--muted);font-size:11px;padding:7px 2px}.tabs button b{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--blue);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #14263808}.hero{background:var(--ink2);color:white;border:0}.hero .muted{color:#c0cfda}.muted{color:var(--muted)}.small{font-size:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.big{font-size:27px;font-weight:850;letter-spacing:-.04em}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.day{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;color:var(--ink);min-height:110px}.day strong{display:block;font-size:17px;margin:4px 0}.day .count{color:var(--muted);font-size:12px}.day.selected{border:2px solid var(--blue);padding:14px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:var(--ink);color:#fff}.btn.blue{background:var(--blue)}.btn.ghost{background:#edf2f6;color:var(--ink)}.btn.green{background:var(--green)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.exercise{padding:15px}.exercise h3{margin:0;font-size:17px}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#edf2f6;color:#526273;font-weight:750}.tag.good{background:var(--greenbg);color:var(--green)}.tag.warn{background:var(--amberbg);color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.stat{background:#f4f7f9;border-radius:12px;padding:9px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}input,select{width:100%;border:1px solid #d5dee6;border-radius:11px;padding:11px;background:white;color:var(--ink);min-width:0}input[type=number]{text-align:center}.setgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.setbox{background:#f4f7f9;border-radius:12px;padding:8px}.setbox label{text-align:center;margin:0 0 5px}.setbox input{padding:10px 3px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{padding:11px 12px;border-radius:12px;background:var(--greenbg);color:var(--green);font-size:13px;font-weight:700;margin-top:12px}.notice.hold{background:var(--amberbg);color:var(--amber)}.sectiontitle{font-size:18px;margin:18px 0 10px}.listrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.pill{display:inline-block;background:#edf2f6;padding:4px 8px;border-radius:99px;font-size:11px;color:#526273}.empty{text-align:center;padding:35px 18px;color:var(--muted)}.hidden{display:none!important}.historyitem{padding:11px 0;border-bottom:1px solid var(--line)}.historyitem:last-child{border:0}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#142638;color:white;padding:10px 15px;border-radius:99px;font-size:13px;z-index:20;box-shadow:0 5px 25px #0003}.modalback{position:fixed;inset:0;background:#0b1b2bcc;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{background:white;width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.modal h2{margin:0 0 5px}.exercisealt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.exercisealt button{white-space:nowrap}.mutedline{font-size:12px;color:var(--muted)}@media(min-width:650px){.content{padding:22px}.top{padding-left:24px;padding-right:24px}.modalback{align-items:center}.modal{border-radius:22px;margin:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="brand">LIFT LOG</div><h1 id="pageTitle">Your training</h1><p id="pageSub">Upper / Lower · 4-day split</p></div><div class="top-actions"><button class="iconbtn" onclick="exportData()" aria-label="Export backup">↥</button><button class="iconbtn" onclick="document.getElementById('importFile').click()" aria-label="Import backup">↧</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div></header>
<main class="content" id="view"></main>
<nav class="tabs"><button class="active" data-tab="home" onclick="navigate('home')"><b>⌂</b>Home</button><button data-tab="workout" onclick="navigate('workout')"><b>▤</b>Workout</button><button data-tab="history" onclick="navigate('history')"><b>◷</b>History</button><button data-tab="library" onclick="navigate('library')"><b>▦</b>Exercises</button></nav>
</div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const ROUTINES = {
"UPPER A":[["Dumbbell Bench Press",4,6,8,["Barbell Bench Press","Machine Chest Press","Smith Machine Bench Press"]],["Barbell Overhead Press",3,6,10,["Seated Dumbbell Shoulder Press","Machine Shoulder Press"]],["Chest-Supported Row",3,8,12,["Seated Cable Row","Machine Row"]],["Lat Pulldown",3,8,12,["Assisted Pull-Up","Neutral-Grip Lat Pulldown"]],["DB Lateral Raise",3,12,15,["Cable Lateral Raise","Machine Lateral Raise"]],["Cable Bar Triceps Pushdown",3,10,15,["Rope Triceps Pushdown","Overhead Cable Triceps Extension"]],["Incline Dumbbell Curl",3,10,15,["EZ-Bar Curl","Cable Curl"]]],
"LOWER A":[["Leg Press",4,8,12,["Hack Squat","Belt Squat"]],["Romanian Deadlift",3,6,10,["Dumbbell Romanian Deadlift","45-Degree Back Extension"]],["Leg Extension",3,10,15,["Single-Leg Leg Extension","Sissy Squat"]],["Lying Leg Curl",3,10,15,["Seated Leg Curl","Standing Leg Curl"]],["Standing Smith Calf Raise",4,8,15,["Standing Calf Raise Machine","Leg Press Calf Raise"]],["Roman Chair Leg Raise",3,10,15,["Hanging Knee Raise","Captain's Chair Knee Raise"]]],
"UPPER B":[["Incline Dumbbell Press",3,8,12,["Incline Barbell Press","Incline Machine Press"]],["Wide Lat Pulldown",4,8,12,["Pull-Up","Wide-Grip Assisted Pull-Up"]],["Seated Cable Row",3,8,12,["Chest-Supported Row","Machine Row"]],["Dumbbell Shoulder Press",3,8,12,["Machine Shoulder Press","Barbell Overhead Press"]],["Cable Fly",3,12,15,["Pec Deck","Dumbbell Fly"]],["Dumbbell Lateral Raise",2,12,20,["Cable Lateral Raise","Machine Lateral Raise"]],["EZ-Bar Curl",3,8,12,["Incline Dumbbell Curl","Cable Curl"]],["Cable Triceps Pushdown",3,10,15,["Rope Triceps Pushdown","Overhead Cable Triceps Extension"]]],
"LOWER B":[["Hack Squat",3,6,10,["Leg Press","Belt Squat"]],["Bulgarian Split Squat",3,8,12,["Reverse Lunge","Smith Machine Split Squat"]],["Hip Thrust",3,8,12,["Glute Bridge","Smith Machine Hip Thrust"]],["Seated Leg Curl",3,10,15,["Lying Leg Curl","Standing Leg Curl"]],["Leg Extension",2,12,15,["Single-Leg Leg Extension","Sissy Squat"]],["Seated Calf Raise",3,10,15,["Standing Calf Raise Machine","Leg Press Calf Raise"]],["Cable Crunch",3,8,15,["Machine Crunch","Decline Sit-Up"]]]
};
const allExercises=[...new Set(Object.values(ROUTINES).flatMap(a=>a.flatMap(e=>[e[0],...e[4]])))].sort();
const KEY="liftlog-upperlower-v1";
let data=load(), tab="home", activeDay="UPPER A", draft={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{weights:{},increments:{},swaps:{},sessions:[]}}catch(e){return {weights:{},increments:{},swaps:{},sessions:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function key(day,base){return day+"::"+base}
function activeName(day,base){return data.swaps[key(day,base)]||base}
function cfg(day,base){let e=ROUTINES[day].find(x=>x[0]===base);return {sets:e[1],min:e[2],max:e[3],alts:e[4]}}
function weight(name){return data.weights[name]??""}
function inc(name){return data.increments[name]??defaultInc(name)}
function defaultInc(n){return /lateral|curl|fly|raise|extension|crunch|leg curl/i.test(n)?1:2.5}
function lastSession(name){return [...data.sessions].reverse().find(s=>s.exercise===name)}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function navigate(t){tab=t;render()}
function header(title,sub){document.getElementById("pageTitle").textContent=title;document.getElementById("pageSub").textContent=sub;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function render(){if(tab==="home")home();if(tab==="workout")workout();if(tab==="history")history();if(tab==="library")library();document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function home(){header("Your training","Upper / Lower · 4-day split");let done=data.sessions.length;let latest=data.sessions.at(-1);document.getElementById("view").innerHTML=`
<div class="card hero"><div class="eyebrow muted">YOUR TRAINING LOG</div><div class="big">${done} <span style="font-size:15px;font-weight:600">sessions logged</span></div><p class="muted small">Your workout history and exercise weights are saved on this device.</p><div class="row wrap"><button class="btn" onclick="navigate('workout')">Start a workout →</button><span class="muted small">${latest?"Last session: "+fmtDate(latest.date):"Ready when you are"}</span></div></div>
<div class="row"><h2 class="sectiontitle">Choose your workout</h2><span class="pill">4-day split</span></div>
<div class="daygrid">${Object.entries(ROUTINES).map(([d,ex])=>`<button class="day" onclick="activeDay='${d}';navigate('workout')"><span class="eyebrow">${d.startsWith("UPPER")?"Upper body":"Lower body"}</span><strong>${d}</strong><span class="count">${ex.length} exercises · ${ex.reduce((s,e)=>s+e[1],0)} sets</span></button>`).join("")}</div>
<h2 class="sectiontitle">Recent activity</h2>${latest?`<div class="card"><div class="row"><b>${esc(latest.day)}</b><span class="muted small">${fmtDate(latest.date)}</span></div><div>${esc(latest.exercise)}</div><div class="muted small">${latest.weight||"No weight"} · ${latest.reps.join(" / ")} reps</div></div>`:`<div class="card empty">Your sessions will appear here after your first workout.</div>`}
<div class="card"><b>Progression rule</b><p class="muted small">Keep the load until every prescribed set reaches the top of its rep range. Then increase by that exercise’s saved increment next time. Swapped exercises keep separate weights and histories.</p></div>`}
function workout(){header(activeDay,"Log reps, check your previous session and progress");let ex=ROUTINES[activeDay];document.getElementById("view").innerHTML=`
<div class="row wrap"><div><div class="eyebrow">SELECTED SESSION</div><b>${activeDay}</b></div><select style="width:auto;min-width:145px" onchange="activeDay=this.value;render()">${Object.keys(ROUTINES).map(d=>`<option ${d===activeDay?"selected":""}>${d}</option>`).join("")}</select></div>
<div class="card" style="margin-top:12px"><div class="row"><b>${ex.length} exercises</b><span class="muted small">${ex.reduce((s,e)=>s+e[1],0)} working sets</span></div><p class="muted small">Tap an exercise to enter your reps. Exercise swaps are available inside each card.</p></div>
${ex.map((e,i)=>exerciseCard(activeDay,e,i)).join("")}
<button class="btn full" onclick="finishWorkout()">Finish ${activeDay} session</button>`}
function exerciseCard(day,e,i){let base=e[0],name=activeName(day,base),c=cfg(day,base),w=weight(name),last=lastSession(name);return `<div class="card exercise"><div class="row"><div><div class="eyebrow">EXERCISE ${i+1}</div><h3>${esc(name)}</h3></div><button class="btn ghost" onclick="openSwap('${esc(day)}','${esc(base)}')">⇄ Swap</button></div>
<div class="stats"><div class="stat"><b>${c.sets}</b><span>SETS</span></div><div class="stat"><b>${c.min}–${c.max}</b><span>REP RANGE</span></div><div class="stat"><b>${w!==""?esc(w)+" kg":"Set weight"}</b><span>WORKING LOAD</span></div></div>
<div class="two"><div><label>Weight used (kg)</label><input type="number" step="0.5" min="0" id="w-${i}" value="${w}" placeholder="e.g. 20"></div><div><label>Previous session</label><div style="padding:11px 4px;font-weight:750">${last?last.reps.join(" / ")+" reps":"No history yet"}</div></div></div>
<label>Reps completed in each set</label><div class="setgrid">${Array.from({length:c.sets},(_,j)=>`<div class="setbox"><label>Set ${j+1}</label><input type="number" min="0" max="99" inputmode="numeric" id="r-${i}-${j}" placeholder="–"></div>`).join("")}</div>
<div id="result-${i}" class="mutedline" style="margin-top:9px">${last?`Last: ${last.weight||"—"} kg · ${fmtDate(last.date)}`:"Log this exercise to start tracking."}</div>
<button class="btn blue full" style="margin-top:11px" onclick="logExercise('${esc(day)}','${esc(base)}',${i})">Save exercise</button></div>`}
function logExercise(day,base,i){let name=activeName(day,base),c=cfg(day,base),w=Number(document.getElementById("w-"+i).value);let reps=Array.from({length:c.sets},(_,j)=>document.getElementById(`r-${i}-${j}`).value===""?null:Number(document.getElementById(`r-${i}-${j}`).value));if(!w||reps.some(x=>x===null||!Number.isFinite(x))){toast("Enter the weight and reps for every set.");return}let success=reps.every(x=>x>=c.max),suggested=success?w+Number(inc(name)):w;let session={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:new Date().toISOString().slice(0,10),day,base,exercise:name,weight:w,reps,sets:c.sets,min:c.min,max:c.max,suggested,success};data.sessions.push(session);data.weights[name]=w;save();document.getElementById("result-"+i).innerHTML=success?`<span style="color:var(--green);font-weight:800">✓ All sets hit ${c.max}. Next time: ${suggested} kg.</span>`:`<span style="color:var(--amber);font-weight:750">Hold at ${w} kg. Build reps towards ${c.max} on every set.</span>`;toast(success?`Great work. Suggested next load: ${suggested} kg`:"Saved. Keep the same weight next time.");}
function finishWorkout(){toast("Session entries are saved as you go.");navigate("history")}
function openSwap(day,base){let name=activeName(day,base),c=cfg(day,base),opts=[base,...c.alts];document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>Swap exercise</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><p class="muted small">Choose a like-for-like alternative for ${esc(base)}. Every exercise has its own saved working weight and history.</p>${opts.map(n=>`<div class="exercisealt"><div><b>${esc(n)}</b><div class="mutedline">${weight(n)!==""?esc(weight(n))+" kg working weight":"No weight set"} · ${data.sessions.filter(s=>s.exercise===n).length} sessions</div></div><button class="btn ${n===name?"green":"ghost"}" onclick="setSwap('${esc(day)}','${esc(base)}','${esc(n)}')">${n===name?"Selected":"Choose"}</button></div>`).join("")}<button class="btn ghost full" style="margin-top:14px" onclick="setSwap('${esc(day)}','${esc(base)}','${esc(base)}')">Restore original exercise</button></div></div>`}
function setSwap(day,base,name){if(name===base)delete data.swaps[key(day,base)];else data.swaps[key(day,base)]=name;save();closeModal();render()}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function library(){header("Exercise library","Manage working weights and progression increments");document.getElementById("view").innerHTML=`<div class="card"><b>Your exercise settings</b><p class="muted small">Set a starting weight and the increase you want to use after all sets reach the top of the rep range. Swapped exercises have independent settings.</p></div>${allExercises.map(n=>`<div class="card"><div class="row"><b>${esc(n)}</b><span class="pill">${data.sessions.filter(s=>s.exercise===n).length} sessions</span></div><div class="two"><div><label>Current working weight (kg)</label><input type="number" step="0.5" min="0" value="${weight(n)}" placeholder="Not set" onchange="setWeight('${esc(n)}',this.value)"></div><div><label>Increase by (kg)</label><input type="number" step="0.5" min="0" value="${inc(n)}" onchange="setInc('${esc(n)}',this.value)"></div></div>${lastSession(n)?`<div class="mutedline" style="margin-top:8px">Last logged: ${lastSession(n).weight} kg · ${lastSession(n).reps.join(" / ")} reps</div>`:""}</div>`).join("")}`}
function setWeight(n,v){if(v==="")delete data.weights[n];else data.weights[n]=Number(v);save()}
function setInc(n,v){if(v==="")return;data.increments[n]=Number(v);save()}
function history(){header("Training history","Your logged sets and progression decisions");let items=[...data.sessions].reverse();document.getElementById("view").innerHTML=items.length?`<div class="row"><b>${items.length} exercise entries</b><button class="btn ghost" onclick="clearHistory()">Clear history</button></div>${items.map(s=>`<div class="card historyitem"><div class="row"><b>${esc(s.exercise)}</b><span class="pill">${esc(s.day)}</span></div><div class="muted small">${fmtDate(s.date)} · ${s.weight} kg · ${s.reps.join(" / ")} reps</div><div class="row" style="margin-top:8px"><span class="tag ${s.success?"good":"warn"}">${s.success?"Increase next time":"Hold weight"}</span><b>${s.suggested} kg next time</b></div></div>`).join("")}`:`<div class="card empty"><div style="font-size:30px">◷</div><b>No sessions logged yet</b><p class="small">Your saved workouts will appear here.</p><button class="btn" onclick="navigate('workout')">Start your first workout</button></div>`}
function clearHistory(){if(confirm("Delete all workout history? Your exercise weights and swaps will be kept.")){data.sessions=[];save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lift-log-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exported.")}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.weights||!d.sessions)throw Error();data={weights:d.weights||{},increments:d.increments||{},swaps:d.swaps||{},sessions:d.sessions||[]};save();render();toast("Backup restored.")}catch(e){toast("That backup file could not be read.")}};r.readAsText(f);ev.target.value=""}
function toast(msg){let el=document.getElementById("toastRoot");el.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML="",2600)}
render();
</script>
</body></html>
